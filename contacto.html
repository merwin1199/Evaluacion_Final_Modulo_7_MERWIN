<!DOCTYPE html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Merwin Sport</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>

                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Contáctanos</h1>
            <p class="text-muted">
                ¿Tienes preguntas sobre nuestros productos deportivos?
                Escríbenos.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="panel p-4">
                    <form id="formularioContacto">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre"
                                name="nombre" required minlength="2"
                                placeholder="Escribe tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correo"
                                name="correo" required
                                placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label">Asunto</label>
                            <select class="form-select" id="asunto" name="asunto" required>
                                <option value="">Selecciona una opción</option>
                                <option value="productos">Información de productos</option>
                                <option value="pedidos">Pedidos y compras</option>
                                <option value="envios">Envíos</option>
                                <option value="otros">Otro asunto</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="mensaje"
                                name="mensaje" rows="5" required minlength="10"
                                placeholder="Escribe tu mensaje"></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">
                            Enviar mensaje
                        </button>

                        <div id="resultadoContacto" class="mt-3"
                            role="status" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; <span data-anio-actual></span>
            Merwin Sport - Tienda online de deportes y ejercicio
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
